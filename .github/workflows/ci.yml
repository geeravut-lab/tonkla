name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Service-role key must never reach the browser bundle
        run: |
          if grep -rIl "service_role\|SUPABASE_SERVICE" .next/static; then echo "service role reference found in client bundle"; exit 1; fi
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --reporter=line
        env:
          CI: "true"
